[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "co2ach"
dynamic = ["version"]
description = "Segmentación de series de CO2 en aulas, estimación de la ACH y pronóstico del CO2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "ruptures>=1.1.9",
    "hmmlearn>=0.3",
    "joblib>=1.2",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "pyarrow>=12",
    "h5py>=3.8",
]

[project.optional-dependencies]
# Chronos necesita PyTorch, que pesa cientos de MB
chronos = ["torch>=2.0", "chronos-forecasting>=1.4"]

[tool.setuptools]
packages = ["co2ach", "co2ach.segmenters"]

[tool.setuptools.dynamic]
version = { attr = "co2ach.__version__" }
